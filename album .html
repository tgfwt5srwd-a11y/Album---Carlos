
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Álbum de Fotos ❤️</title>

    <style>

        /* ------------------------------
           CONFIGURACIÓN GENERAL
        ------------------------------ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1b1028, #4b214c, #19142e);
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }


        /* ------------------------------
           TÍTULO
        ------------------------------ */

        h1 {
            text-align: center;
            margin-top: 30px;
            font-size: 40px;
            color: #fff;
            text-shadow: 0 0 10px #ff8acb,
                         0 0 20px #ff4fa3;
        }

        .subtitulo {
            text-align: center;
            margin-top: 8px;
            color: #ffd6ed;
        }


        /* ------------------------------
           ÁLBUM
        ------------------------------ */

        .album {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            position: relative;
            z-index: 5;
        }

        .foto {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
            text-align: center;
        }

        .foto img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            transition: transform 0.5s;
        }

        .foto img:hover {
            transform: scale(1.03);
        }


        /* ------------------------------
           TEXTO
        ------------------------------ */

        .texto {
            padding: 20px;
        }

        .texto h2 {
            font-size: 28px;
            color: #ffb7df;
            margin-bottom: 10px;
        }

        .texto p {
            font-size: 17px;
            color: #ffeaf7;
            line-height: 1.5;
        }


        /* ------------------------------
           BOTONES
        ------------------------------ */

        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            background: #ff5ca8;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff2d8b;
            transform: scale(1.1);
            box-shadow: 0 0 15px #ff69b4;
        }


        /* ------------------------------
           ESTRELLAS
        ------------------------------ */

        .estrella {
            position: fixed;
            color: white;
            font-size: 15px;
            animation: brillar 2s infinite alternate;
            z-index: 1;
        }

        @keyframes brillar {

            0% {
                opacity: 0.2;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1.4);
            }

        }


        /* ------------------------------
           CORAZONES
        ------------------------------ */

        .corazon {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            animation: subir 6s linear infinite;
            z-index: 2;
        }

        @keyframes subir {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }

        }


        /* ------------------------------
           ANIMACIÓN DE FOTOS
        ------------------------------ */

        .entrada {
            animation: aparecer 0.6s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* ------------------------------
           CELULARES
        ------------------------------ */

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            .foto img {
                height: 280px;
            }

            .foto {
                padding: 12px;
            }

        }

    </style>
</head>


<body>


    <!-- TÍTULO -->

    <h1>❤️ Mi Álbum de Fotos ❤️</h1>

    <p class="subtitulo">
        Algunos momentos especiales ✨
    </p>


    <!-- ÁLBUM -->

    <div class="album">

        <div class="foto" id="foto">

            <img id="imagen" src="imagenes/foto1.jpg">

            <div class="texto">

                <h2 id="titulo">
                    Nuestro primer recuerdo
                </h2>

                <p id="descripcion">
                    Este es uno de esos momentos que vale la pena guardar
                    para siempre. ❤️
                </p>

            </div>


            <!-- BOTONES -->

            <div class="botones">

                <button onclick="anterior()">
                    ⬅️ Anterior
                </button>

                <button onclick="siguiente()">
                    Siguiente ➡️
                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        /* ------------------------------
           FOTOS DEL ÁLBUM
        ------------------------------ */

        const fotos = [

            {
                imagen: "imagenes/foto1.jpg",
                titulo: "Nuestro primer recuerdo",
                descripcion: "Un momento que siempre voy a recordar. ❤️"
            },

            {
                imagen: "imagenes/foto2.jpg",
                titulo: "Un día especial",
                descripcion: "Un recuerdo lleno de felicidad y buenos momentos. ✨"
            },

            {
                imagen: "imagenes/foto3.jpg",
                titulo: "Momentos increíbles",
                descripcion: "Cada fotografía guarda una historia diferente. 💕"
            },

            {
                imagen: "imagenes/foto4.jpg",
                titulo: "Un recuerdo más",
                descripcion: "Porque algunos momentos merecen quedarse para siempre. 🌟"
            }

        ];


        /* ------------------------------
           POSICIÓN ACTUAL
        ------------------------------ */

        let posicion = 0;


        /* ------------------------------
           MOSTRAR FOTO
        ------------------------------ */

        function mostrarFoto() {

            const imagen = document.getElementById("imagen");
            const titulo = document.getElementById("titulo");
            const descripcion = document.getElementById("descripcion");
            const contenedor = document.getElementById("foto");


            imagen.src = fotos[posicion].imagen;

            titulo.textContent = fotos[posicion].titulo;

            descripcion.textContent = fotos[posicion].descripcion;


            /* Reiniciar animación */

            contenedor.classList.remove("entrada");

            void contenedor.offsetWidth;

            contenedor.classList.add("entrada");

        }


        /* ------------------------------
           SIGUIENTE FOTO
        ------------------------------ */

        function siguiente() {

            posicion++;

            if (posicion >= fotos.length) {
                posicion = 0;
            }

            mostrarFoto();

        }


        /* ------------------------------
           FOTO ANTERIOR
        ------------------------------ */

        function anterior() {

            posicion--;

            if (posicion < 0) {
                posicion = fotos.length - 1;
            }

            mostrarFoto();

        }


        /* ------------------------------
           CREAR ESTRELLAS
        ------------------------------ */

        function crearEstrellas() {

            for (let i = 0; i < 50; i++) {

                const estrella = document.createElement("div");

                estrella.classList.add("estrella");

                estrella.textContent = "✦";

                estrella.style.left =
                    Math.random() * 100 + "%";

                estrella.style.top =
                    Math.random() * 100 + "%";

                estrella.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(estrella);

            }

        }


        /* ------------------------------
           CREAR CORAZONES
        ------------------------------ */

        function crearCorazon() {

            const corazon = document.createElement("div");

            corazon.classList.add("corazon");

            corazon.textContent = "❤️";

            corazon.style.left =
                Math.random() * 100 + "%";

            corazon.style.animationDuration =
                (4 + Math.random() * 4) + "s";

            document.body.appendChild(corazon);


            /* Eliminar corazón después de la animación */

            setTimeout(() => {

                corazon.remove();

            }, 8000);

        }


        /* ------------------------------
           INICIAR ANIMACIONES
        ------------------------------ */

        crearEstrellas();

        setInterval(crearCorazon, 700);

    </script>

</body>
</html>
```
